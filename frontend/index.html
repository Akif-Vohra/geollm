<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>GeoLLM App</title>
  </head>
  <body>
    <a href="https://github.com/Akif-Vohra/geollm"
       target="_blank"
       rel="noopener"
       class="position-fixed bottom-0 end-0 m-4 text-dark"
       title="View on GitHub">
      <i class="bi bi-github fs-2 bg-white rounded-circle shadow p-2"></i>
    </a>
    <div class="container-fluid" x-data="geoLLM()">
      <div class="row">
        <div class="col-md-9 p-0">
          <div id="map-container" style="position: relative;">
            <div id="map-title"></div>
            <div id="map" aria-label="Map" style="height: 100vh;"></div>
          </div>
        </div>

        <div class="col-md-3 border-start sidebar">
          <div class="p-3">
            <div class="mb-4">
              <div class="brandmark">Geo<span class="accent">LLM</span></div>
              <div class="brand-tag">Ask · map · explore</div>
            </div>
            <label class="form-label fw-semibold small text-secondary mb-2" for="model">
              Model
            </label>

            <div class="input-group shadow-sm rounded-3 overflow-hidden">
              <select id="model" class="form-control form-select border-0" x-model="model">
                <template x-for="m in models" :key="m.id">
                  <option :value="m.id" x-text="m.label"></option>
                </template>
              </select>
            </div>

            <label class="form-label fw-semibold small text-secondary mb-2" for="graphType">
              Type of graph
            </label>

            <div class="input-group shadow-sm rounded-3 overflow-hidden">
              <select id="graphType" class="form-control form-select border-0" x-model="graphType">
                <option value="interactive_point">Interactive point Map</option>
                <option value="flow_route">Flow/route Map</option>
                <option value="timeline">Timeline Map</option>
                <option value="choropleth">Choropleth Map</option>
              </select>
            </div>

            <div class="input-group shadow-sm rounded-3 overflow-hidden mt-3">
              <span class="input-group-text bg-white border-0">
                <i class="bi bi-search text-muted"></i>
              </span>
              <textarea
                id="search_query"
                type="search"
                class="form-control border-0"
                placeholder="Type your query.. e.g Where can you find lions in the world?"
                aria-label="Search"
                x-model="query"
              ></textarea>
            </div>

            <div class="mt-3 d-grid gap-2">
              <button class="btn btn-primary rounded-3 shadow-sm py-2 fw-semibold" :disabled="loading" @click="run()">
                <i class="bi bi-play-fill me-1"></i> Run Query
              </button>

              <button class="btn btn-outline-secondary w-100 mt-2" :disabled="loading" @click="exportImage()">
                <i class="bi bi-image me-1"></i> Export Map as PNG
              </button>
              <template x-if="loading">
                <span>
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                  Running…
                </span>
              </template>

              <button class="btn btn-outline-secondary rounded-3 py-2" @click="clearMap()">
                <i class="bi bi-x-circle me-1"></i> Clear Map
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
